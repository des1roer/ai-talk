name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # golang.org/x/sys/windows — собирается и тестируется только под Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 -v ./...
